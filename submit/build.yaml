AWSTemplateFormatVersion: "2010-09-09"
Description: DS5220 Data Project 1 - Anomaly Detection Pipeline

Parameters:
  MyIP:
    Type: String
    Description: Your public IP address for SSH (e.g. 1.2.3.4/32)

Resources:

# S3 bucket

  DataBucket:
    Type: AWS::S3::Bucket
    DependsOn: SNSTopicPolicy
    Properties:
      NotificationConfiguration:
        TopicConfigurations:
          - Event: s3:ObjectCreated:*
            Topic: !Ref SNSTopic
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
                  - Name: suffix
                    Value: .csv

# IAM role for EC2

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

  EC2Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BucketAccessPolicy
      Roles:
        - !Ref EC2Role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

# Security group

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and FastAPI
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0

# EC2 instance

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0e86e20dae9224db8  # Ubuntu 24.04 (example)
      KeyName: DS5220
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 16
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          apt-get update -y
          apt-get install -y git python3 python3-pip python3-venv

          cd /opt
          git clone https://github.com/Cy-2004/anomaly-detection.git
          cd anomaly-detection

          python3 -m venv venv

          source venv/bin/activate
          pip install -r requirements.txt

          export BUCKET_NAME=${DataBucket}
          echo "BUCKET_NAME=${DataBucket}" >> /etc/environment

          venv/bin/fastapi run app.py --host 0.0.0.0 --port 8000

# Elastic IP

  ElasticIP:
    Type: AWS::EC2::EIP

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref EC2Instance
      EIP: !Ref ElasticIP

# SNS topic

  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ds5220-dp1
    
  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SNSTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SNSTopic

# SNS subscription

  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: http
      TopicArn: !Ref SNSTopic
      Endpoint: !Sub "http://${ElasticIP}:8000/notify"

# Outputs

Outputs:

  InstancePublicIP:
    Description: Elastic IP of the FastAPI server
    Value: !Ref ElasticIP

  BucketName:
    Description: S3 Bucket used by pipeline
    Value: !Ref DataBucket